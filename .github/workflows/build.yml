name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip

      - name: Validate (Lua syntax, XML, tests)
        run: |
          set -e
          for f in $(find scripts -name '*.lua'); do lua5.1 -e "assert(loadfile('$f'))" || { echo "does not parse: $f"; exit 1; }; done
          for f in modDesc.xml $(ls vehicles/*/*.xml handTools/*/*.xml l10n/*.xml); do python3 -c "import sys,xml.dom.minidom as m; m.parse(sys.argv[1])" "$f" || { echo "not well formed: $f"; exit 1; }; done
          for f in tests/*.lua; do lua5.1 "$f"; done

      - name: Build mod
        run: bash build/build.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: FS25_Hammer
          path: build/FS25_Hammer.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: build/FS25_Hammer.zip
